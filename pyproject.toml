[project]
name = "mcp-server-python"
version = "0.1.0"
description = "Documentation intelligence MCP server for searching, retrieving, answering, and comparing official developer documentation."
readme = "README.md"
authors = [
    { name = "Aarush Pradhan", email = "aarushpradhan4@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.0.8",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "trafilatura>=2.2.0",
]

[project.scripts]
mcp-server-python = "mcp_server_python.server:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
